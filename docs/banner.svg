<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Firewall Log for OpenWrt">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="shield2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bbg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)"/>

  <g transform="translate(955 -55) scale(0.9)" opacity="0.07">
    <path d="M256 104 L388 150 V262 C388 338 334 392 256 416 C178 392 124 338 124 262 V150 Z"
          fill="none" stroke="#67e8f9" stroke-width="26" stroke-linejoin="round"/>
    <rect x="180" y="180" width="152" height="22" rx="11" fill="#67e8f9"/>
    <rect x="180" y="228" width="120" height="22" rx="11" fill="#67e8f9"/>
    <rect x="180" y="276" width="88" height="22" rx="11" fill="#67e8f9"/>
  </g>

  <g transform="translate(136 52) scale(0.42)">
    <path d="M256 104 L388 150 V262 C388 338 334 392 256 416 C178 392 124 338 124 262 V150 Z"
          fill="none" stroke="url(#shield2)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    <g stroke-linecap="round">
      <rect x="180" y="180" width="152" height="22" rx="11" fill="#fb7185"/>
      <rect x="180" y="228" width="120" height="22" rx="11" fill="#fbbf24"/>
      <rect x="180" y="276" width="88" height="22" rx="11" fill="#34d399"/>
    </g>
    <circle cx="292" cy="287" r="11" fill="#67e8f9"/>
  </g>

  <text x="392" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1.8">Firewall Log</text>
  <rect x="395" y="170" width="86" height="4" rx="2" fill="url(#accent)"/>
  <text x="394" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="26" font-weight="500" fill="#cbd5e1">Confirmed WAN verdicts for OpenWrt 25.12</text>
  <text x="394" y="256" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="20" fill="#67e8f9">nftables · IPv4 + IPv6 · GeoIP stays on the router</text>
  <text x="394" y="288" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="600" fill="#94a3b8" letter-spacing="0.3">Blocked means the firewall said so — not a guess.</text>
</svg>
